<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume - Hudson Schmidt</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css?v=2">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Hudson Schmidt</a>
            <button class="navbar-toggler" type="button" id="navToggler" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/experience/">Experience</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/projects/">Projects</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/education/">Education</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/photography/">Photography</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/resume/">Resume</a>
                    </li>
                </ul>
            </div>
            <div class="d-flex">
                <a id="profile" class="nav-link" href="https://www.linkedin.com/in/hudson-schmidt" target="_blank" rel="noopener noreferrer">
                    <img src="../images/linkedin.png" alt="LinkedIn Logo" width="30" height="30" class="rounded-circle">
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div id="resumebody">
        <div class="doc-tabs">
            <button class="doc-tab doc-tab--active" data-index="0">Resume</button>
            <button class="doc-tab" data-index="1">CV</button>
        </div>
        <p id="loading-message">Loading...</p>
        <div id="doc-container" style="display: none;">
            <embed id="doc-embed" src="" type="application/pdf" width="100%" height="1200px" style="border: none;">
            <p class="mt-3">
                <a id="doc-download" href="" target="_blank" rel="noopener noreferrer">Download PDF</a>
            </p>
        </div>
        <div id="error-message" class="alert alert-danger" style="display: none;"></div>
        <div id="no-resume-message" style="display: none;">
            <p>No documents available</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/config.js?v=2"></script>
    <script src="../js/main.js?v=2"></script>
    <script src="../js/resume.js?v=2"></script>
</body>
</html>
